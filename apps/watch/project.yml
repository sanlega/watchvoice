# XcodeGen spec for the independent watchOS app. Generate with `xcodegen` from apps/watch.
#
# Whistle (on-device ASR) is the primary engine. Run scripts/fetch-needle.sh first for device builds:
# libneedle.a is watchOS DEVICE only (arm64_32 + arm64, no simulator slice, minOS 26.2), so it is linked
# only for the watchos SDK and the Swift code compiles the real engine only outside the simulator.
# Simulator builds get the blocked stub and fall back to system dictation.
name: VoxWatch
options:
  bundleIdPrefix: app.vox
  deploymentTarget:
    watchOS: "26.2"
  createIntermediateGroups: true
  # Spanish UI; also the language the App Shortcut phrases are written in.
  developmentLanguage: es
configs:
  Debug: debug
  Release: release
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Root (App Store Connect) bundle id of the iOS stub; the watch app and widget ids derive from it.
    VOX_APP_BUNDLE_ID: com.santilega.vox
schemes:
  # Archived by fastlane (apps/watch/fastlane): the stub wraps the watch app for App Store upload.
  VOX:
    build:
      targets:
        VOX: all
targets:
  # Stub iOS wrapper of the watch-only app (no iOS executable; nothing installs on the iPhone).
  # Apple: Xcode needs it to set the root bundle id and to package the app for the App Store.
  VOX:
    type: application.watchapp2-container
    platform: iOS
    deploymentTarget: "17.0"
    dependencies:
      - target: VoxWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VOX_APP_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: VOX

  # Same sources as the VoxWatchCore Swift package (used on macOS for `swift test`).
  # Built here as a framework so it can carry the needle link settings.
  VoxWatchCore:
    type: framework
    platform: watchOS
    sources:
      - path: VoxWatchCore/Sources/VoxWatchCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vox.watch.core
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SKIP_INSTALL: YES
        # CNeedle/module.modulemap exposes Vendor/needle/needle.h to Swift as `import CNeedle`.
        SWIFT_INCLUDE_PATHS[sdk=watchos*]: "$(inherited) $(PROJECT_DIR)/CNeedle"
        OTHER_LDFLAGS[sdk=watchos*]: "$(inherited) $(PROJECT_DIR)/Vendor/needle/libneedle.a -lc++"

  VoxWatch:
    type: application
    platform: watchOS
    sources:
      - path: VoxWatch
    dependencies:
      - target: VoxWatchCore
      - target: VoxWidgets
    info:
      path: VoxWatch/Info.plist
      properties:
        CFBundleDisplayName: VOX
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKWatchOnly: true
        WKRunsIndependentlyOfCompanionApp: true
        NSMicrophoneUsageDescription: "VOX usa el micrófono solo mientras grabas una instrucción para tus agentes. El audio no sale del reloj salvo que lo autorices en Ajustes."
    # APNs (ADR-0001 §6). Requires a PAID Apple Developer Program team: free/personal teams cannot
    # sign aps-environment. Distribution export normally re-signs it as production (verify on first upload).
    entitlements:
      path: VoxWatch/VoxWatch.entitlements
      properties:
        aps-environment: development
    attributes:
      SystemCapabilities:
        com.apple.Push:
          enabled: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VOX_APP_BUNDLE_ID).watchkitapp
        # Archived inside the VOX stub, not as a top-level product.
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # The model-embed script below reads Vendor/ outside the declared inputs.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Embed Whistle model
        basedOnDependencyAnalysis: false
        script: |
          MODEL="${PROJECT_DIR}/Vendor/needle/whistle.cact"
          if [ -f "$MODEL" ]; then
            cp "$MODEL" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/whistle.cact"
          elif [ "$PLATFORM_NAME" = "watchos" ]; then
            # Device builds must ship the model; the simulator never runs Whistle.
            echo "error: $MODEL missing. Run scripts/fetch-needle.sh"
            exit 1
          fi

  # Watch face complication ("Dictar a VOX"), embedded in the app.
  VoxWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: VoxWidgets
    info:
      path: VoxWidgets/Info.plist
      properties:
        CFBundleDisplayName: VOX
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VOX_APP_BUNDLE_ID).watchkitapp.widgets
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
