name: ci
on:
  # PR branches run once (pull_request); master runs on push. Avoids doubling macOS minutes.
  push: {branches: [master], tags: ["v*"]}
  pull_request:
permissions: {contents: read, pull-requests: read}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  # Explicit Xcode on the pinned macos-26 image (bump together with runs-on).
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
jobs:
  changes:
    # Path filters live here, not in `on:`, so skipped jobs still report to required checks.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      watch: ${{ steps.f.outputs.watch }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: f
        with:
          filters: |
            backend: [backend/**, contracts/**, .github/workflows/ci.yml]
            watch: [apps/**, contracts/**, .github/workflows/ci.yml]
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
  watch-core:
    # Logic + contract-fixture tests of the watch client. Whistle is not linked here
    # (no simulator slice exists); device validation is manual (W-023).
    needs: changes
    if: needs.changes.outputs.watch == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    defaults: {run: {working-directory: apps/watch/VoxWatchCore}}
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: swift test
  watch-app:
    # Generic destination build: no simulator is booted (avoids CoreSimulator flakes).
    needs: changes
    if: needs.changes.outputs.watch == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    defaults: {run: {working-directory: apps/watch}}
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: brew install xcodegen && xcodegen
      - run: xcodebuild -project VoxWatch.xcodeproj -target VoxWatch -sdk watchsimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
  watch-device:
    # Device build with the real Whistle engine: verifies libneedle.a links for arm64_32/arm64 and
    # whistle.cact is bundled. It does not run anything (on-device acceptance is issue #13).
    needs: changes
    if: needs.changes.outputs.watch == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    defaults: {run: {working-directory: apps/watch}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: apps/watch/Vendor/needle
          # The script pins the sha256 of every artifact, so its hash identifies the vendor set.
          key: needle-${{ hashFiles('apps/watch/scripts/fetch-needle.sh') }}
      - run: scripts/fetch-needle.sh
      - run: xcodebuild -version
      - run: brew install xcodegen && xcodegen
      - run: xcodebuild -project VoxWatch.xcodeproj -target VoxWatch -sdk watchos -configuration Release CODE_SIGNING_ALLOWED=NO build
      - name: Check model and engine are in the app
        run: |
          APP=build/Release-watchos/VoxWatch.app
          test "$(stat -f%z "$APP/whistle.cact")" = 16919407
          nm -gU "$APP/Frameworks/VoxWatchCore.framework/VoxWatchCore" | grep -q _needle_transcribe
          lipo -info "$APP/Frameworks/VoxWatchCore.framework/VoxWatchCore"
